<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Mask Detection</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Attractive Modern Header -->
    <header class="attractive-header">
        <div class="logo">
            <div class="logo-icon-bg">
                <i class="fa-solid fa-head-side-mask logo-icon"></i>
            </div>
            <div class="logo-text">
                <span class="text-black fw-700">Face Mask</span>
                <span class="text-teal fw-600">Detection</span>
            </div>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn btn-home active">
                <i class="fa-solid fa-house"></i> HOME
            </button>
            <button class="nav-btn btn-icon">
                <i class="fa-solid fa-clipboard-check"></i>
            </button>
            <button class="nav-btn btn-icon">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
        </div>
        
        <div class="user-profile">
            <div class="status-dot green" id="api-status"></div>
            <i class="fa-regular fa-circle-user profile-icon"></i>
        </div>
    </header>

    <main class="dashboard">
        <!-- Left Panel: Mask Recognition -->
        <aside class="side-panel left-panel">
            <div class="panel-card">
                <h2 class="panel-title text-teal">MASK RECOGNITION</h2>
                
                <div class="recognition-bars">
                    <div class="bar-container">
                        <div class="bar-bg border-black">
                            <div class="bar-fill bg-light-green" id="mask-on-bar" style="width: 0%;"></div>
                        </div>
                        <span class="bar-label text-light-green fw-500">Wearing Mask <span id="mask-on-text"></span></span>
                    </div>
                    
                    <div class="bar-container mt-2">
                        <div class="bar-bg border-black">
                            <div class="bar-fill bg-orange" id="mask-off-bar" style="width: 0%;"></div>
                        </div>
                        <span class="bar-label text-orange fw-500">Not Wearing Mask <span id="mask-off-text"></span></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Center: Video/Image Feed -->
        <section class="center-feed">
            <div class="feed-container" id="feed-container">
                <video id="webcam" autoplay playsinline muted></video>
                <img id="image-preview" src="" class="hidden" alt="Uploaded Profile">
                <canvas id="canvas" class="hidden"></canvas>
                
                <div class="scanning-effect hidden" id="scanning-effect"></div>
            </div>
            <div class="center-controls">
                <button id="start-btn" class="feed-btn bg-teal text-white"><i class="fa-solid fa-camera"></i> Start Camera</button>
                <button id="stop-btn" class="feed-btn bg-orange text-white hidden"><i class="fa-solid fa-stop"></i> Stop Camera</button>
                <button id="reanalyze-btn" class="feed-btn bg-teal text-white hidden"><i class="fa-solid fa-rotate-right"></i> Analyze Image</button>
            </div>
        </section>

        <!-- Right: Image Detection & Details -->
        <aside class="side-panel right-panel">
            <div class="panel-card mb-2">
                <h2 class="panel-title text-teal fs-sm">Image Detection</h2>
                <div class="drag-drop-zone" id="drop-zone">
                    <i class="fa-solid fa-images file-icon"></i>
                    <p class="drop-text text-teal">Drop your Files Here</p>
                    <label for="file-upload" class="browse-btn">Browse File</label>
                    <input type="file" id="file-upload" class="hidden" accept="image/*">
                </div>
            </div>

            <div class="panel-card">
                <h2 class="panel-title text-teal fs-sm">Image Details</h2>
                <div class="details-content">
                    <div class="detail-item">
                        <span class="detail-label">Dimensions</span>
                        <span class="detail-value text-black fw-600" id="detail-dim">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">File Format</span>
                        <span class="detail-value text-black fw-600" id="detail-format">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Resolution</span>
                        <span class="detail-value text-black fw-600" id="detail-res">-</span>
                    </div>
                </div>
                <!-- Mock images to fit design -->
                <div class="mock-images">
                    <div class="mock-img"></div>
                    <div class="mock-img"></div>
                    <div class="mock-img w-full"></div>
                </div>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
